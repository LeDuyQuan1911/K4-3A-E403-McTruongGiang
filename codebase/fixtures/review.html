<h1>Kiểm tra câu trả lời — dữ liệu giả để kiểm thử</h1>
<p>Khi viết bài giảng, người biên soạn cần kiểm tra xem đoạn trích có thực sự hỗ trợ câu đang viết hay không.</p>
<p>Nếu nguồn không đủ căn cứ, người viết cần bổ sung tài liệu hoặc bỏ khẳng định đó khỏi kịch bản.</p>
